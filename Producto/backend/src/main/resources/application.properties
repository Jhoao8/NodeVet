spring.application.name=app

# Conexion a tu base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/nodevet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=${NODEVET_PASS_WB}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion para Mailtrap o Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${NODEVET_MAIL_EMAIL}
spring.mail.password=${NODEVET_MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# LÍMITES DE ARCHIVOS MULTIMEDIA
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Configuracion usuario inicial
nodevet.admin.email=${NV_ADMIN_EMAIL}
nodevet.admin.password=${NV_ADMIN_PASS}

# Configuración de FLOW (Ambiente SANDBOX)
flow.base-url=https://sandbox.flow.cl/api
flow.api-key=${FLOW_API_KEY}
flow.secret-key=${FLOW_SECRET_KEY}
flow.return-url=http://localhost:8080/api/v1/pagos/confirmar

#Desactivar liquidbase
spring.liquibase.enabled=false