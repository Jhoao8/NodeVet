# ==========================================
# CONFIGURACIÓN GENERAL
# ==========================================
spring.application.name=app
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.liquibase.enabled=false

# Bases de datos (usa variables de entorno para seguridad)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=America/Santiago
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# CONFIGURACIÓN DE CORREO Y ADMIN
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${NODEVET_MAIL_EMAIL}
spring.mail.password=${NODEVET_MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

nodevet.admin.email=${NV_ADMIN_EMAIL}
nodevet.admin.password=${NV_ADMIN_PASS}

# ==========================================
# LÍMITES Y SEGURIDAD
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
jwt.secret=${JWT_SECRET:PalabraSecretaSuperSeguraParaNodeVet2026_Portafolio}

# ==========================================
# CONFIGURACIÓN DE FLOW (Dinámica)
# ==========================================
flow.base-url=https://sandbox.flow.cl/api
flow.api-key=${FLOW_API_KEY}
flow.secret-key=${FLOW_SECRET_KEY}

# Esta es la ruta que configuraremos con Ngrok cada vez que pruebes localmente
flow.confirm-url=${FLOW_CONFIRM_URL}

# El Toggle global para forzar pago
nodevet.pagos.obligatorio=true