spring.application.name=app

# Conexion a tu base de datos
# spring.datasource.url=jdbc:mysql://localhost:3306/nodevet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
# spring.datasource.username=root
# spring.datasource.password=${NODEVET_PASS_WB}

# La URL debe usar las variables de entorno
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion para Mailtrap o Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${NODEVET_MAIL_EMAIL}
spring.mail.password=${NODEVET_MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# LÍMITES DE ARCHIVOS MULTIMEDIA
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Configuracion usuario inicial
nodevet.admin.email=${NV_ADMIN_EMAIL}
nodevet.admin.password=${NV_ADMIN_PASS}

# ==========================================
# CONFIGURACIÓN DE FLOW (ENTORNO SANDBOX/PRUEBAS)
# ==========================================
# La URL base del entorno de pruebas de Flow
flow.base-url=https://sandbox.flow.cl/api

# Tus credenciales (reemplaza con tus variables de entorno o valores directos)
flow.api-key=${FLOW_API_KEY}
flow.secret-key=${FLOW_SECRET_KEY}

# URL a la que Flow enviará al usuario después de intentar pagar
flow.return-url=http://localhost:5173/pago/resultado

# URL para el Webhook (La usa tu ReservaService para confirmar de fondo)
flow.confirm-url=https://dash-straddle-discolor.ngrok-free.dev/api/v1/pagos/webhook

# Toggle global en memoria para exigir pago al reservar (editable por Admin vía API)
nodevet.pagos.obligatorio=true

spring.liquibase.enabled=false

# ==========================================
# CONFIGURACIÓN DE SEGURIDAD (JWT)
# ==========================================
# Lee la variable de entorno JWT_SECRET. Si no existe, usa la palabra por defecto.
jwt.secret=${JWT_SECRET:PalabraSecretaSuperSeguraParaNodeVet2026_Portafolio}

