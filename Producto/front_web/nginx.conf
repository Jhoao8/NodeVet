server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Soporta el routing de React (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvia /api al backend que corre en el equipo anfitrion (host).
    # Como el frontend esta dockerizado por separado (sin servicio 'backend'
    # en esta red), se usa host.docker.internal = la IP del host en Docker Desktop.
    location /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
