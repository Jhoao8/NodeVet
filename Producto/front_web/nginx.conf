server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Flow devuelve al usuario con POST a la urlReturn; la SPA solo se sirve
    # por GET, asi que convertimos el POST en una redireccion GET (303).
    location = /pago/resultado {
        if ($request_method = POST) {
            return 303 $uri$is_args$args;
        }
        try_files /index.html =404;
    }

    # Soporta el routing de React (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvia /api al backend que corre en el equipo anfitrion (host).
    # Como el frontend esta dockerizado por separado (sin servicio 'backend'
    # en esta red), se usa host.docker.internal = la IP del host en Docker Desktop.
    location /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
